name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar el proyecto y sus dependencias
        run: python -m pip install -e ".[dev]"

      - name: Verificar la version declarada
        run: python tools/check_version.py

      - name: Suite completa (unittest)
        run: python -m unittest discover -s tests -v

      - name: Lint (ruff)
        run: ruff check src tests tools

  package:
    name: Empaquetado
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar herramientas de empaquetado
        run: python -m pip install --upgrade pip build twine

      - name: Construir el paquete
        run: python -m build

      - name: Comprobar los metadatos del paquete
        run: twine check dist/*

      - name: Instalar el paquete recien construido y ejecutarlo
        run: |
          python -m pip install --force-reinstall dist/*.whl
          qetgen --version
          qetgen sheets --json > /dev/null
          # La biblioteca de fixtures permite ejercitar el catalogo, el
          # diagnostico y la generacion sin depender de QElectroTech.
          qetgen doctor --library tests/fixtures/qet_elements --json > /dev/null
          qetgen build examples/basic_circuit.json \
            --library tests/fixtures/qet_elements -o smoke.qet
          python -c "import pathlib; assert pathlib.Path('smoke.qet').stat().st_size > 0"

  docs:
    name: Enlaces de la documentacion
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar el proyecto
        run: python -m pip install -e .

      - name: Comprobar que la documentacion apunta a archivos que existen
        run: python tools/check_doc_links.py

      - name: Comprobar que los fixtures de la biblioteca estan sincronizados
        run: python tools/sync_fixtures.py --check
