name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar el proyecto y sus dependencias
        run: python -m pip install -e ".[dev]"

      - name: Verificar la versión declarada
        run: |
          python - <<'PY'
          import pathlib
          import re

          import qetgen

          version = qetgen.__version__
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          declared = match.group(1) if match else None
          assert declared == version, (
              f'versión incoherente: __init__={version} pyproject={declared}')
          print('versión declarada:', version)
          PY

      - name: Suite completa (unittest)
        run: python -m unittest discover -s tests -v

      - name: Lint (ruff)
        run: ruff check src tests tools

  package:
    name: Empaquetado
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar herramientas de empaquetado
        run: python -m pip install --upgrade pip build twine

      - name: Construir el paquete
        run: python -m build

      - name: Comprobar los metadatos del paquete
        run: twine check dist/*

      - name: Instalar el paquete recién construido y ejecutarlo
        run: |
          python -m pip install --force-reinstall dist/*.whl
          qetgen --version
          qetgen sheets --json > /dev/null
          qetgen doctor --json > /dev/null

  docs:
    name: Enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar el proyecto
        run: python -m pip install -e .

      - name: Comprobar que la documentación apunta a archivos que existen
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          docs = list(root.glob('*.md')) + list((root / 'docs').glob('*.md'))
          missing = []
          pattern = re.compile(r'\[[^\]]*\]\(([^)#]+)\)')
          for doc in docs:
              for target in pattern.findall(doc.read_text(encoding='utf-8')):
                  if target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  resolved = (doc.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f'{doc}: {target}')
          if missing:
              print('Enlaces rotos:')
              for item in missing:
                  print('  -', item)
              sys.exit(1)
          print(f'{len(docs)} documentos verificados, sin enlaces rotos.')
          PY
